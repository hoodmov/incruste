<style>
/* Polish : finitions d'interaction (pression, focus, entrées d'overlays, rail de jours), sans changer le fonctionnement */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--gut:clamp(16px,2.5vw,48px);accent-color:var(--key);caret-color:var(--key)}
@media (max-width:600px){:root{--gut:12px}}
::selection{background:color-mix(in srgb,var(--key) 32%,transparent);color:inherit}
html{scrollbar-color:color-mix(in srgb,var(--muted) 55%,transparent) transparent}
body{-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
a{text-underline-offset:.18em}
.grid b,.grid div>span:last-child,.shot-info .foc,.shot-info [class*="foc"]{font-variant-numeric:tabular-nums}

/* Rail des jours : pleine largeur, translucide, jour courant + jour visible */
nav.days{margin-inline:calc(-1*var(--gut));padding-inline:var(--gut);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);scrollbar-width:none}
nav.days::-webkit-scrollbar{display:none}
nav.days a{position:relative;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .16s var(--ease-out)}
nav.days a.vis{background:var(--ink);border-color:var(--ink);color:var(--bg)}
nav.days a.vis span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
nav.days a.today{border-color:var(--key);box-shadow:inset 0 0 0 1px var(--key)}
nav.days a.today::after{content:"Auj.";position:absolute;top:-7px;right:-4px;font:700 .58rem/1 var(--body);letter-spacing:.02em;background:var(--key);color:var(--chipfg);padding:2px 4px;border-radius:3px}
@supports not (backdrop-filter:blur(1px)){nav.days{background:var(--bg)}}

/* Boutons vidéo + texte : même alignement quand ils passent à la ligne */
.vidbtn{margin-right:8px}.vidbtn+.txtbtn{margin-left:0}

/* Tactile : pas de délai de double-tap, pas de rebond qui fait défiler la page sous un overlay */
button,a,.pic,summary,[role="button"]{touch-action:manipulation}
#lb,#vb,#tx,#lv,#lk,#rp,#pl,#cp,.txbody{overscroll-behavior:contain}
/* Passage ref <-> clean : fondu court (le flou masque l'échange d'images) */
.pic img{transition:opacity .16s ease,filter .16s ease,transform .25s}
.pic img.swp{opacity:.35;filter:blur(3px)}

/* Pression : retour immédiat sur tout ce qui se clique */
button,nav.days a,.pic,.txtbtn,.lkbtn,summary{transition:transform .16s var(--ease-out),background-color .18s ease,border-color .18s ease,color .18s ease,opacity .18s ease}
button:not(:disabled):active,nav.days a:active,.txtbtn:active,.lkbtn:active{transform:scale(.97)}
.pic:active{transform:scale(.995)}
button:disabled{cursor:default}

/* Focus clavier visible partout, jamais au clic */
a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:4px}

/* Survol uniquement avec une souris (évite l'état collé au doigt) */
@media (hover:none){.pic:hover img{transform:none!important}}
@media (hover:hover) and (pointer:fine){
  nav.days a:not(.vis):hover{border-color:var(--muted)}
  .txtbtn:hover,.lkbtn:hover{border-color:var(--key)}
}

/* Champ vide (Note lumière « — ») : présent pour l'édition, mais discret */
.lfx.empty{opacity:.55}

/* Entrées d'overlays : courtes, depuis un état déjà presque visible */
@media (prefers-reduced-motion:no-preference){
  #lb,#vb,#tx,#lv,#lk,#rp,#pl,#cp{transition:opacity .2s var(--ease-out),transform .2s var(--ease-out);transition-behavior:allow-discrete}
  @starting-style{#lb:not([hidden]),#vb:not([hidden]),#lv:not([hidden]),#lk:not([hidden]),#cp:not([hidden]){opacity:0}}
  @starting-style{#tx:not([hidden]),#rp:not([hidden]),#pl:not([hidden]){opacity:0;transform:translateY(12px)}}
  #lbimg{transition:opacity .16s ease}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* ===== Direction D (mix Feuille de service + Clap) : habillage seul, le balisage ne change pas ===== */
:root{--soft:color-mix(in srgb,var(--ink) 5%,var(--surface));--r-card:18px;--r-ctl:12px}
h1,h2,h3,.dt,.jn,.foc{font-family:var(--display)}
.seq h2{font-weight:900;letter-spacing:.01em}
.dayhead{border-bottom-width:3px}
.jn{border-radius:8px;font-weight:900}
.dt{font-weight:800}
/* carte */
.shot{padding:0;gap:0;border:0;border-radius:var(--r-card);overflow:hidden;background:var(--surface);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 5%,transparent),0 14px 34px -18px color-mix(in srgb,var(--ink) 35%,transparent);margin-top:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shot{box-shadow:0 0 0 1px var(--line)}}
:root[data-theme="dark"] .shot{box-shadow:0 0 0 1px var(--line)}
.shot-pic{background:#000;display:flex;flex-direction:column;position:relative}
.shot-pic .pic{border-radius:0;flex:1;display:flex;align-items:center}
.shot-pic .pic img{max-height:70vh}
.shot-pic .lkbtn{margin:0;border-radius:0;border:0;border-top:1px solid #222;background:#111;color:#fff;font:600 .9rem var(--body);padding:12px;width:100%;display:flex;justify-content:center;align-items:center;gap:6px}
.shot-info{padding:16px 18px 18px;gap:12px}
.shot.isref{background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--muted) 45%,transparent) inset;border:0}
/* plan + focale en pastille */
.plan .n{font:600 .74rem var(--mono);color:var(--fd)}
.lens{background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;justify-content:space-between;flex-wrap:nowrap}
.lens .foc{order:-1;font-weight:900;font-size:clamp(2.2rem,4vw,2.8rem);line-height:.9;white-space:nowrap}
.lens .chip{border-radius:6px;font:600 .7rem var(--mono);letter-spacing:.04em;white-space:nowrap}
.lens .chip.ref{background:color-mix(in srgb,var(--surface) 20%,transparent);color:var(--surface)}
/* réglages en pastilles */
.grid{gap:8px;background:transparent;border:0;border-radius:0;overflow:visible}
.grid div{background:var(--soft);border-radius:var(--r-ctl);padding:8px 12px}
.grid dt{font:500 .7rem var(--mono);letter-spacing:.08em}
.grid dd{font:600 1.12rem var(--body);font-variant-numeric:tabular-nums}
/* lignes de régie : Lumière / Face match / Lecture / VFX / Note lumière */
.light,.read,.vfx,.lfx{display:grid;grid-template-columns:96px minmax(0,1fr) auto;column-gap:10px;align-items:baseline;margin:0;padding:8px 0 0;border:0;border-top:1px solid var(--line)}
.light{padding-top:0;row-gap:0}
.light h4,.light .ratio::before,.vfx::before,.lfx::before,.read b{font:500 .7rem/1.9 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.light h4{grid-column:1;padding-top:8px}
.light>p:not(.ratio){grid-column:2;margin:0;padding-top:8px;font-size:.92rem;line-height:1.45}
.light>.edrst{grid-column:3}
.light .ratio{grid-column:1/-1;display:grid;grid-template-columns:96px minmax(0,1fr) auto;column-gap:10px;align-items:baseline;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line);border-radius:0;background:none;font:500 .78rem/1.55 var(--mono)}
.light .ratio::before{content:"Face match";font-weight:500}
.read{font-size:.88rem}
.read b{font-weight:500}
.vfx::before{content:"Note VFX"}
.vfx{font:500 .82rem var(--body);color:var(--ink)}
.lfx::before{content:"Note lumière"}
.lfx{font:500 .82rem var(--body);color:var(--ink)}
.lfx.empty{opacity:.5}
/* boutons de séquence */
.vidbtn,.txtbtn{border-radius:var(--r-ctl);border:1.5px solid var(--ink);color:var(--ink);background:var(--surface)}
.vidbtn .pl,.txtbtn .pl{background:var(--ink);color:var(--surface)}
@media (hover:hover) and (pointer:fine){.vidbtn:hover,.txtbtn:hover{background:var(--soft);border-color:var(--ink)}.shot-pic .lkbtn:hover{background:#1c1c1c}}
/* téléphone : images pleine largeur (demandé), carte à bords droits */
@media (max-width:760px){.shot-pic .pic img{max-height:none}}
@media (max-width:600px){.shot{border-radius:0;margin-inline:-12px;box-shadow:none;border-block:1px solid var(--line)}.shot-info{padding:14px 12px 4px}.shot-pic .lkbtn{margin:0}.light,.read,.vfx,.lfx,.light .ratio{grid-template-columns:84px minmax(0,1fr) auto}}
/* ===== Système commun : mêmes polices, graisses, rayons et couleurs sur toutes les fenêtres ===== */
:root{--r-pop:14px;--lbl:500 .7rem/1.6 var(--mono)}
/* libellés de champs partout : mono, petites capitales espacées, gris */
.edextra label,#pl label:not(.plfile),.pdtline span small,.pdtline em,#rp th{font:var(--lbl);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
/* champs de saisie */
.edextra select,.edextra textarea,#pl input:not([type=file]),#pl select,#pl textarea,#tx .txbar input,#tx .txbar select{font:500 .92rem var(--body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.edextra select:focus-visible,.edextra textarea:focus-visible,#pl input:focus-visible,#pl select:focus-visible,#pl textarea:focus-visible{outline:2px solid var(--key);outline-offset:1px}
::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
/* boutons des barres et fenêtres */
#tx .txbar button,#rp .rpbar button,#rp .rpbar label,#pl button,#edmenu button{font:600 .85rem var(--body);border-radius:10px}
#tx .txbar button,#rp .rpbar button{background:var(--soft);border:1px solid var(--line);color:var(--ink)}
#tx .txbar #txx,#rp .rpbar button:first-child{background:var(--ink);color:var(--surface);border-color:var(--ink)}
#edmenu,#edpop{border-radius:var(--r-pop)}
#edbar button{font-weight:600}
/* titres de fenêtres en police d'affiche */
#tx .txbar .tt,#pl .plh,#rp h1,#rp h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em}
#pl .plh{font-size:1.35rem}
#rp h1{font-weight:900}
#pl .plbox{border-radius:var(--r-card);padding:18px}
#pl .plfile{border-radius:12px;font:600 .92rem var(--body);text-transform:none;letter-spacing:0;color:var(--ink);background:var(--soft)}
#pl #plok{width:100%;padding:12px;background:var(--ink);color:var(--surface);border:0;border-radius:12px;font:600 .95rem var(--body)}
#pl #plok:disabled{opacity:.4;cursor:not-allowed}
/* fenêtres sombres (zoom, vidéo) : mêmes boutons que Incruste live */
#lb button,#vb button{background:#222221;color:#f1f0eb;border:1px solid #2c2c2a;border-radius:10px;font:600 .85rem var(--body);min-height:36px}
#lb #lbclose,#vb #vbclose{background:#f1f0eb;color:#0b0b0b;border-color:#f1f0eb}
#lb .bar p,#vb .bar p{font:500 .85rem var(--body);color:#d9d8d2}
/* bandeau PDT (lieu / installation) : carte, plus de barre verte à gauche */
.pdtline{border:1px solid var(--line);border-left-width:1px;border-left-color:var(--line);border-radius:var(--r-pop);background:var(--surface);font:600 .88rem var(--body);padding:10px 14px}
.pdtline a{font:600 .8rem var(--body)}
.pdtseq{font:500 .78rem var(--mono);color:var(--muted)}
.pdtseq b{color:var(--ink);font-weight:600}
/* nombres partout alignés */
.pdtline,.pdtseq,#rp td,.dmeta span,nav.days a span{font-variant-numeric:tabular-nums}
</style>
<script>
(function(){
// Jour courant (date du tournage) et jour visible dans le rail
var nav=document.querySelector('nav.days');if(!nav)return;
var links=[].slice.call(nav.querySelectorAll('a[href^="#J"]'));
var now=new Date(),dd=('0'+now.getDate()).slice(-2)+'/'+('0'+(now.getMonth()+1)).slice(-2);
links.forEach(function(a){var s=a.querySelector('span');if(s&&s.textContent.trim()===dd){a.classList.add('today');a.setAttribute('aria-label',a.textContent.replace(/\s+/g,' ').trim()+' (aujourd’hui)')}});
var map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a});
var cur=null;
function setVis(id){if(id===cur||!map[id])return;cur=id;links.forEach(function(a){a.classList.toggle('vis',a===map[id]);if(a===map[id])a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});
  var a=map[id],r=a.offsetLeft-nav.clientWidth/2+a.offsetWidth/2;if(nav.scrollWidth>nav.clientWidth)nav.scrollTo({left:Math.max(0,r),behavior:'smooth'})}
if('IntersectionObserver' in window){
  var seen={};
  var io=new IntersectionObserver(function(es){es.forEach(function(e){seen[e.target.id]=e.isIntersecting?e.boundingClientRect.top:null});
    var lim=Math.max(140,innerHeight*.45),best=null,bt=-1e9;Object.keys(seen).forEach(function(k){var t=seen[k];if(t!==null&&t<=lim&&t>bt){bt=t;best=k}});
    if(!best){var mn=1e9;Object.keys(seen).forEach(function(k){var t=seen[k];if(t!==null&&t<mn){mn=t;best=k}})}
    if(best)setVis(best)},{rootMargin:'-80px 0px -40% 0px',threshold:[0,.01,.25,.5,.75,1]});
  links.forEach(function(a){var el=document.getElementById(a.getAttribute('href').slice(1));if(el)io.observe(el)});
}
// Lien vers un jour (#J3) : le contenu chargé ensuite (tableur, images) décale la page ; on recale tant que l'utilisateur n'a pas bougé
var moved=false;['wheel','touchstart','keydown','mousedown'].forEach(function(ev){addEventListener(ev,function(){moved=true},{passive:true,once:true})});
function recal(){if(moved||!location.hash)return;var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView({block:'start'})}
[300,900,1800,3200].forEach(function(ms){setTimeout(recal,ms)});
addEventListener('hashchange',function(){moved=false;[400,1200].forEach(function(ms){setTimeout(recal,ms)})});
// Note lumière vide : discrète
function lfx(){[].forEach.call(document.querySelectorAll('.lfx'),function(p){var v=p.querySelector('.lfxv');p.classList.toggle('empty',!v||v.textContent.trim()==='—'||!v.textContent.trim())})}
lfx();new MutationObserver(function(){clearTimeout(lfx.t);lfx.t=setTimeout(lfx,120)}).observe(document.querySelector('.wrap')||document.body,{subtree:true,characterData:true,childList:true});
})();
</script>

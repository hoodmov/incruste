<style>
#edbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:calc(100vw - 16px)}
#edbar button{font:600 .85rem var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;min-height:40px}
#edbar button.on{background:var(--key);border-color:var(--key);color:var(--chipfg)}
#edbar .cnt{font:600 .75rem var(--body);color:var(--muted);padding:0 6px;white-space:nowrap}
#edpop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);z-index:41;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.28);min-width:260px;max-width:calc(100vw - 24px);font:400 .9rem var(--body)}
#edpop[hidden]{display:none}#edpop h4{margin:0 0 6px;font:700 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#edpop ul{list-style:none;margin:0 0 8px;padding:0}#edpop li{display:flex;gap:8px;align-items:center;padding:4px 0}
#edpop .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}#edpop .dot.on{background:var(--key)}
#edpop small{color:var(--muted);margin-left:auto;white-space:nowrap}#edpop button{font:600 .85rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
#edmenu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);z-index:41;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#edmenu[hidden]{display:none}
#edmenu button{font:500 .9rem var(--body);color:var(--ink);background:transparent;border:0;text-align:left;padding:10px 14px;border-radius:8px;cursor:pointer}
#edmenu button:hover{background:var(--bg)}
body.editing .ed{outline:1.5px dashed var(--muted);outline-offset:2px;cursor:text;border-radius:3px;min-width:2ch}
body.editing .ed:focus{outline:2px solid var(--key);background:var(--bg)}
.edrst{display:none;margin:0 0 0 6px;padding:0 6px;height:20px;border:1px solid var(--line,#444);border-radius:10px;background:transparent;color:var(--muted,#999);font:600 .7rem var(--body,system-ui);cursor:pointer;vertical-align:middle}
body.editing .edrst{display:inline-block}
.edrst:hover{color:var(--ink);border-color:var(--ink)}
.edrst[disabled]{opacity:.35;cursor:default}
.edextra{display:none;margin-top:8px;gap:8px;flex-wrap:wrap;align-items:flex-start}
body.editing .edextra{display:flex}
.edextra label{font:600 .68rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:3px}
.edextra select,.edextra textarea{font:400 .95rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;box-sizing:border-box}
.edextra textarea{min-height:56px;resize:vertical}
.edextra .st{flex:0 0 150px}.edextra .nt{flex:1 1 220px}
.notev{margin:8px 0 0;padding:6px 10px;border-left:4px solid var(--gm);font-size:.95rem}
.stbadge{display:inline-block;font:700 .7rem var(--body);text-transform:uppercase;letter-spacing:.07em;border-radius:3px;padding:2px 7px;margin-left:8px;color:var(--chipfg)}
.stbadge.ok{background:var(--key)}.stbadge.no{background:var(--fd)}
#rp{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);overflow:auto;padding:0 0 40px}
#rp[hidden]{display:none}
#rp .rpbar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px}
#rp .rpbar button{font:600 .85rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer}
#rp .rpbar label{font:500 .85rem var(--body);display:flex;gap:6px;align-items:center}
#rp .rpbody{padding:16px;max-width:1100px;margin:0 auto}
#rp h1{font:700 1.9rem var(--display);margin:0 0 4px}
#rp h2{font:700 1.4rem var(--display);margin:22px 0 6px;border-bottom:2px solid var(--key)}
#rp h3{font:600 .95rem var(--body);margin:12px 0 4px;color:var(--muted)}
#rp .rpcaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:12px 0 22px}
#rp .rpcaps figure{margin:0;position:relative}
#rp .rpcaps img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px;display:block}
#rp .rpcaps figcaption{font:500 .8rem var(--body);margin-top:5px;padding-right:30px}
#rp .rpcaps small{display:block;color:var(--muted)}
#rp .rpdel{position:absolute;right:0;bottom:2px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.8rem}
@media print{#rp .rpdel{display:none}#rp .rpcaps{break-inside:avoid}#rp .rpcaps figure{break-inside:avoid}}
#rp .meta{color:var(--muted);font-size:.9rem;margin:0 0 8px}
#rp table{border-collapse:collapse;width:100%;font-size:.85rem;background:var(--surface)}
#rp th,#rp td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
#rp th{background:var(--bg);font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.06em}
#rp td.m{color:var(--gm);font-weight:700}#rp td.m small{display:block;color:var(--muted);font-weight:400}
#rp .tw{overflow-x:auto}
@media print{body.rp-open>*:not(#rp){display:none!important}#rp{position:static;overflow:visible;background:#fff;color:#000}#rp .rpbar{display:none}#rp table{background:#fff}#rp td.m{color:#000;text-decoration:underline}}
</style>
<div id="edbar" role="toolbar" aria-label="Édition des fiches"><button id="edtog" type="button">✎ Modifier</button><button id="edrep" type="button">📋 Compte-rendu</button><button id="edmore" type="button" aria-label="Sauvegarde">⋯</button><span class="cnt" id="edcnt"></span><button id="edsync" type="button" class="cnt" style="border:0;background:transparent;cursor:pointer" aria-label="Appareils connectés"></button></div>
<div id="edpop" hidden></div>
<div id="edmenu" hidden><button id="edtx" type="button">📜 Tous les textes</button><button id="edgh" type="button">☁ Synchro entre appareils (GitHub)</button><button id="edexp" type="button">⬇ Exporter la sauvegarde (.json)</button><button id="edimp" type="button">⬆ Importer une sauvegarde</button><button id="edrst" type="button">↺ Tout remettre aux valeurs prévues</button></div>
<input type="file" id="edfile" accept="application/json,.json" hidden>
<div id="rp" hidden role="dialog" aria-modal="true" aria-label="Compte-rendu caméra"></div>
<script>
(function(){
var KEY='lgi.edits.v2',OLD='lgi.edits.v1',TK='lgi.gh',mem=null,S={},E={};
var GH={repo:'hoodmov/incruste',path:'data/edits.json',branch:'data',pres:'data/presence.json'};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(){var s=lsGet(KEY);if(s){try{return JSON.parse(s)}catch(e){}}
  var o=lsGet(OLD),r={};if(o){try{var j=JSON.parse(o);Object.keys(j).forEach(function(id){Object.keys(j[id]).forEach(function(f){r[id+'|'+f]={v:j[id][f],t:1}})})}catch(e){}}return r}
function rebuildE(){E={};Object.keys(S).forEach(function(k){var x=S[k];if(x&&x.v!=null){var i=k.indexOf('|'),id=k.slice(0,i),f=k.slice(i+1);(E[id]=E[id]||{})[f]=x.v}})}
function save(){lsSet(KEY,JSON.stringify(S))}
S=load();rebuildE();
var FIELDS=['lens','foc','Diaph','Distance','Hauteur caméra','Inclinaison','Lumière','Ratio visage','Note lumière'];
var shots=[];
function txt(el){return el.textContent.replace(/\s+/g,' ').trim()}
[].forEach.call(document.querySelectorAll('.shot'),function(sh){
  if(sh.classList.contains('isref'))return;
  var info=sh.querySelector('.shot-info'),pic=sh.querySelector('.pic');
  if(!info||!pic||!info.querySelector('.lens'))return;
  var id=pic.getAttribute('data-full').replace(/^.*\//,'').replace(/[?#].*$/,'').replace(/\.jpg$/,'');
  var els={lens:info.querySelector('.lens .chip'),foc:info.querySelector('.foc'),'Lumière':info.querySelector('.light p'),'Note lumière':info.querySelector('.lfx .lfxv'),'Ratio visage':info.querySelector('.light .ratio span')};
  [].forEach.call(info.querySelectorAll('.grid > div'),function(d){els[txt(d.querySelector('dt'))]=d.querySelector('dd')});
  var day=sh.closest('.day'),seq=sh.closest('.seq'),h2=seq&&seq.querySelector('h2'),pl=info.querySelector('.plan');
  var rec={id:id,sh:sh,els:els,info:info,day:day?day.id:'',seq:h2?txt(h2):'',n:(pl.querySelector('.n')||{textContent:''}).textContent,plan:txt(pl).replace(/^#\d+\s*/,''),orig:{}};
  FIELDS.forEach(function(f){var el=els[f];if(el){el.classList.add('ed');rec.orig[f]=txt(el);el.setAttribute('data-f',f);el.setAttribute('data-id',id);
    var rb=document.createElement('button');rb.type='button';rb.className='edrst';rb.textContent='↺';rb.title='Réinitialiser ('+f+')';rb.setAttribute('aria-label',rb.title);rb.setAttribute('data-f',f);rb.setAttribute('data-id',id);el.insertAdjacentElement('afterend',rb);(rec.rb=rec.rb||{})[f]=rb}});
  var ex=document.createElement('div');ex.className='edextra';
  ex.innerHTML='<div class="st"><label>Statut</label><select><option value="">À tourner</option><option value="ok">Tourné</option><option value="no">Non tourné</option></select></div><div class="nt"><label>Note tournage (pour le montage)</label><textarea placeholder="ex : tourné au 50 pour raccord avec le plan précédent"></textarea></div>';
  info.appendChild(ex);
  var nv=document.createElement('p');nv.className='notev';nv.hidden=true;info.appendChild(nv);
  var bd=document.createElement('span');bd.className='stbadge';bd.hidden=true;pl.appendChild(bd);
  rec.sel=ex.querySelector('select');rec.ta=ex.querySelector('textarea');rec.nv=nv;rec.bd=bd;
  shots.push(rec);
});
var byId={};shots.forEach(function(r){byId[r.id]=r});
function val(r,f){var e=E[r.id];return e&&e[f]!=null?e[f]:r.orig[f]}
function setE(id,f,v){var r=byId[id],del=(v===''||v==null||(r.orig[f]!=null&&v===r.orig[f]&&f!=='note'&&f!=='st'));
  S[id+'|'+f]={v:del?null:v,t:Date.now()};rebuildE();save();dirty=true;schedulePush()}
function render(r){
  FIELDS.forEach(function(f){var el=r.els[f];if(!el)return;var v=val(r,f);if(document.activeElement!==el&&txt(el)!==v)el.textContent=v;
    var m=v!==r.orig[f];el.classList.toggle('ed-mod',m);if(r.rb&&r.rb[f])r.rb[f].disabled=!m});
  var e=E[r.id]||{};r.sel.value=e.st||'';if(document.activeElement!==r.ta)r.ta.value=e.note||'';
  r.nv.hidden=!e.note;r.nv.textContent=e.note?'Note tournage : '+e.note:'';
  r.bd.hidden=!e.st;r.bd.className='stbadge '+(e.st||'');r.bd.textContent=e.st==='ok'?'Tourné':e.st==='no'?'Non tourné':'';
}
function count(){var n=0;shots.forEach(function(r){FIELDS.forEach(function(f){if(val(r,f)!==r.orig[f])n++})});var c=document.getElementById('edcnt');c.textContent=n?n+' modif.':'';return n}
function renderAll(){shots.forEach(render);count();try{document.dispatchEvent(new CustomEvent('lgi:st'))}catch(e){}}
window.lgiEd={st:function(id){var e=E[id]||{};return e.st||''},setSt:function(id,v){if(!byId[id])return;setE(id,'st',v);render(byId[id]);try{document.dispatchEvent(new CustomEvent('lgi:st'))}catch(e){}}};
renderAll();
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('.edrst');if(!b)return;ev.preventDefault();ev.stopPropagation();var id=b.getAttribute('data-id'),f=b.getAttribute('data-f'),r=byId[id];if(!r)return;setE(id,f,r.orig[f]);render(r);count()},true);
document.addEventListener('input',function(ev){var t=ev.target;
  if(t.classList&&t.classList.contains('ed')){var id=t.getAttribute('data-id'),f=t.getAttribute('data-f');setE(id,f,txt(t));var r=byId[id],m=txt(t)!==r.orig[f];t.classList.toggle('ed-mod',m);if(r.rb&&r.rb[f])r.rb[f].disabled=!m;count()}
});
document.addEventListener('focusout',function(ev){var t=ev.target;if(t.classList&&t.classList.contains('ed')){var r=byId[t.getAttribute('data-id')];if(!txt(t)){setE(r.id,t.getAttribute('data-f'),'')}render(r);count()}});
document.addEventListener('keydown',function(ev){var t=ev.target;if(t.classList&&t.classList.contains('ed')&&ev.key==='Enter'){ev.preventDefault();t.blur()}});
document.addEventListener('paste',function(ev){var t=ev.target;if(t.classList&&t.classList.contains('ed')){ev.preventDefault();var s=(ev.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' ');document.execCommand('insertText',false,s)}});
shots.forEach(function(r){
  r.sel.addEventListener('change',function(){setE(r.id,'st',r.sel.value);render(r)});
  r.ta.addEventListener('input',function(){setE(r.id,'note',r.ta.value.trim()?r.ta.value:'');r.nv.hidden=!r.ta.value.trim();r.nv.textContent=r.ta.value.trim()?'Note tournage : '+r.ta.value:''});
});
var tog=document.getElementById('edtog');
function setEdit(on){document.body.classList.toggle('editing',on);tog.classList.toggle('on',on);tog.textContent=on?'✓ Terminer':'✎ Modifier';
  shots.forEach(function(r){FIELDS.forEach(function(f){var el=r.els[f];if(el){if(on)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable')}})})}
tog.onclick=function(){setEdit(!document.body.classList.contains('editing'))};
var menu=document.getElementById('edmenu');
document.getElementById('edmore').onclick=function(){menu.hidden=!menu.hidden};
document.addEventListener('click',function(ev){if(!menu.hidden&&!ev.target.closest('#edmenu,#edmore'))menu.hidden=true});
function dl(name,mime,data){var b=new Blob([data],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
document.getElementById('edexp').onclick=function(){menu.hidden=true;dl('incruste-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({v:2,items:S},null,1))};
var fi=document.getElementById('edfile');
document.getElementById('edimp').onclick=function(){menu.hidden=true;fi.click()};
fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result),it=j.items;if(!it&&j.edits){it={};Object.keys(j.edits).forEach(function(id){Object.keys(j.edits[id]).forEach(function(k){it[id+'|'+k]={v:j.edits[id][k],t:Date.now()}})})}
  if(it){var now=Date.now();Object.keys(it).forEach(function(k){S[k]={v:it[k].v,t:it[k].t>1?it[k].t:now}});rebuildE();save();renderAll();dirty=true;schedulePush();alert('Sauvegarde importée.')}else alert('Fichier non reconnu.')}catch(e){alert('Fichier non reconnu.')}fi.value=''};rd.readAsText(f)};
document.getElementById('edrst').onclick=function(){menu.hidden=true;if(confirm('Remettre toutes les valeurs prévues sur TOUS vos appareils ? (modifications et notes effacées)')){var now=Date.now();Object.keys(S).forEach(function(k){S[k]={v:null,t:now}});rebuildE();save();renderAll();dirty=true;schedulePush()}};
/* synchro GitHub */
var dirty=false,timer=null,busy=false,stEl=document.getElementById('edsync');
function token(){return lsGet(TK)||''}
var stBase='',online=[];function status(t){stBase=t;paintSt()}
function paintSt(){if(stEl)stEl.textContent=stBase+(online.length>1?' · '+online.length+' 👥':'')}
function dec(b){var bin=atob(b.replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function enc(s){var u=new TextEncoder().encode(s),r='';for(var i=0;i<u.length;i++)r+=String.fromCharCode(u[i]);return btoa(r)}
function hdr(){var h={Accept:'application/vnd.github+json'};if(token())h.Authorization='Bearer '+token();return h}
function remote(){return fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+GH.path+'?ref='+GH.branch+'&t='+Date.now(),{headers:hdr(),cache:'no-store'}).then(function(r){
  if(r.status===404)return{sha:null,items:{}};if(!r.ok)throw new Error('http '+r.status);return r.json().then(function(j){var it={};try{it=JSON.parse(dec(j.content)).items||{}}catch(e){}return{sha:j.sha,items:it}})})}
function mergeIn(it){var ch=false;Object.keys(it).forEach(function(k){var x=it[k];if(!S[k]||x.t>S[k].t){S[k]=x;ch=true}});return ch}
function localNewer(it){return Object.keys(S).some(function(k){return !it[k]||S[k].t>it[k].t})}
function sync(n){if(busy)return Promise.resolve();busy=true;status('☁ …');
  return remote().then(function(R){var ch=mergeIn(R.items);if(ch){rebuildE();save();renderAll()}
    if(token()&&(dirty||localNewer(R.items))){
      var body={message:'Édition tournage',content:enc(JSON.stringify({v:2,items:S})),branch:GH.branch};if(R.sha)body.sha=R.sha;
      return fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+GH.path,{method:'PUT',headers:hdr(),body:JSON.stringify(body)}).then(function(r){
        if(r.status===409||r.status===422){busy=false;if((n||0)<3)return sync((n||0)+1);throw new Error('conflit')}
        if(!r.ok)throw new Error('http '+r.status);dirty=false;status('☁ synchronisé')})}
    dirty=false;status(token()?'☁ synchronisé':'☁ lecture seule')}).catch(function(e){status('⚠ hors ligne')}).then(function(){busy=false})}
function schedulePush(){status('☁ …');clearTimeout(timer);timer=setTimeout(function(){sync()},1500)}

/* présence */
var DID=lsGet('lgi.did');if(!DID){DID=Math.random().toString(36).slice(2,10);lsSet('lgi.did',DID)}
function guess(){var u=navigator.userAgent;return /iPad/.test(u)?'iPad':/iPhone/.test(u)?'iPhone':/Android/.test(u)?'Android':/Mac/.test(u)?(navigator.maxTouchPoints>1?'iPad':'Mac'):/Windows/.test(u)?'PC':'Appareil'}
function myName(){return lsGet('lgi.name')||guess()}
function pget(){return fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+GH.pres+'?ref='+GH.branch+'&t='+Date.now(),{headers:hdr(),cache:'no-store'}).then(function(r){
  if(r.status===404)return{sha:null,d:{}};if(!r.ok)throw new Error('http '+r.status);return r.json().then(function(j){var d={};try{d=JSON.parse(dec(j.content)).devices||{}}catch(e){}return{sha:j.sha,d:d}})})}
function calc(d){var now=Date.now();online=Object.keys(d).filter(function(k){return now-d[k].t<150000}).map(function(k){return Object.assign({id:k},d[k])});paintSt()}
var pbusy=false;
function beat(n){if(!token()||pbusy)return Promise.resolve();pbusy=true;
  return pget().then(function(P){var d=P.d,now=Date.now();Object.keys(d).forEach(function(k){if(now-d[k].t>86400000)delete d[k]});d[DID]={n:myName(),t:now};calc(d);
    var body={message:'présence',content:enc(JSON.stringify({v:1,devices:d})),branch:GH.branch};if(P.sha)body.sha=P.sha;
    return fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+GH.pres,{method:'PUT',headers:hdr(),body:JSON.stringify(body)}).then(function(r){pbusy=false;if((r.status===409||r.status===422)&&(n||0)<2)return beat((n||0)+1)})}).catch(function(){}).then(function(){pbusy=false})}
setInterval(function(){if(!document.hidden&&!(window.lgiLiveOn&&window.lgiLiveOn()))beat()},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)beat()});
var pop=document.getElementById('edpop');
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'à l’instant':m<60?'il y a '+m+' min':m<1440?'il y a '+Math.round(m/60)+' h':'il y a '+Math.round(m/1440)+' j'}
function showPop(d){var ids=Object.keys(d).sort(function(a,b){return d[b].t-d[a].t}),now=Date.now();
  pop.innerHTML='<h4>Appareils synchronisés</h4><ul>'+(ids.length?ids.map(function(k){var on=now-d[k].t<150000;return'<li><span class="dot'+(on?' on':'')+'"></span><b>'+esc(d[k].n)+(k===DID?' (toi)':'')+'</b><small>'+(on?'en ligne':ago(d[k].t))+'</small></li>'}).join(''):'<li>Aucun appareil vu pour l’instant.</li>')+'</ul>'+(token()?'<button id="edname" type="button">✎ Nommer cet appareil</button>':'<p style="margin:0;color:var(--muted)">Mode lecture seule : ajoute le jeton (menu ⋯) pour apparaître ici.</p>');
  var nb=document.getElementById('edname');if(nb)nb.onclick=function(){var v=prompt('Nom de cet appareil (visible par les autres) :',myName());if(v&&v.trim()){lsSet('lgi.name',v.trim().slice(0,24));beat().then(function(){pget().then(function(P){showPop(P.d)})})}}}
stEl.onclick=function(ev){ev.stopPropagation();if(!pop.hidden){pop.hidden=true;return}menu.hidden=true;pop.hidden=false;pop.innerHTML='<h4>Appareils synchronisés</h4><p style="margin:0">…</p>';(token()?beat():Promise.resolve()).then(pget).then(function(P){calc(P.d);showPop(P.d)}).catch(function(){pop.innerHTML='<h4>Appareils synchronisés</h4><p style="margin:0">Impossible de charger (hors ligne ?).</p>'})};
document.addEventListener('click',function(ev){if(!pop.hidden&&!ev.target.closest('#edpop,#edsync'))pop.hidden=true});
